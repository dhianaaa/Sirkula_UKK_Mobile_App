name: sirkula_banksampah
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  http: ^1.2.2
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  pdf: ^3.11.1
  printing: ^5.13.3
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# Konfigurasi Flutter Launcher Icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/iconApp.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/sirkula.png
    - assets/pemilahan.png
    - assets/icon/iconApp.png
    - assets/logoatas.png

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.woff
        - asset: assets/fonts/Poppins-Medium.woff
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.woff
          weight: 600
        - asset: assets/fonts/Poppins-Bold.woff
          weight: 700